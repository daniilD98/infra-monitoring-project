name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/monitoring]

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Bash syntax
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh

      - name: Test check_api.sh with valid URL
        run: bash check_api.sh https://httpbin.org/status/200
